client_max_body_size 50M;

# Block access to sensitive PHP backend files
location ~ ^/(app_config|db|crypto|lsb|prng|payload|nav|error_session)\.php$ {
    deny all;
    return 404;
}

# Block access to .env and dotfiles
location ~ /\. {
    deny all;
    return 404;
}

# Block access to config, build, and documentation files
location ~ ^/(composer\.json|composer\.lock|requirements\.txt|database_schema\.sql|oryx-manifest\.toml|README\.md|EXPLANATION\.txt)$ {
    deny all;
    return 404;
}

# Block access to bin/ directory
location ^~ /bin/ {
    deny all;
    return 404;
}

# Block access to vendor/ directory
location ^~ /vendor/ {
    deny all;
    return 404;
}
