server {
    listen 8080;
    root /home/site/wwwroot;
    index index.php index.html;

    client_max_body_size 200M;
    client_body_buffer_size 128k;
    client_body_timeout 300s;

    # -------------------------------------------------------
    # SECURITY: Block dotfiles (.env, .htaccess, .git, etc.)
    # This must come first so it takes highest priority
    # -------------------------------------------------------
    location ~ /\. {
        deny all;
        return 404;
    }

    # -------------------------------------------------------
    # SECURITY: Block sensitive PHP include files
    # These are internal files not meant for direct access
    # -------------------------------------------------------
    location ~ ^/(app_config|db|crypto|lsb|prng|payload|nav|error_session)\.php$ {
        deny all;
        return 404;
    }

    # -------------------------------------------------------
    # SECURITY: Block sensitive config/build/doc files
    # -------------------------------------------------------
    location ~ ^/(composer\.json|composer\.lock|requirements\.txt|database_schema\.sql|oryx-manifest\.toml|README\.md|EXPLANATION\.txt)$ {
        deny all;
        return 404;
    }

    # -------------------------------------------------------
    # SECURITY: Block bin/ and vendor/ directories entirely
    # -------------------------------------------------------
    location ^~ /bin/ {
        deny all;
        return 404;
    }

    location ^~ /vendor/ {
        deny all;
        return 404;
    }

    # -------------------------------------------------------
    # Normal request handling
    # -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # -------------------------------------------------------
    # PHP-FPM handler (Azure App Service Linux uses port 9000)
    # -------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 600s;
        fastcgi_read_timeout 600s;
    }
}
