user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # CRITICAL: Increase client max body size for file uploads
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Default server configuration
    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;

        server_name _;
        root /home/site/wwwroot;

        # PHP-FPM upstream
        upstream php {
            server unix:/var/run/php-fpm.sock;
        }

        # Client body size for uploads
        client_max_body_size 50M;

        # Default location
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP files
        location ~ \.php$ {
            fastcgi_pass php;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            
            # Pass upload limits to PHP-FPM
            fastcgi_param PHP_ADMIN_VALUE "upload_max_filesize=50M post_max_size=50M";
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
        }

        # Disable logging for favicon and robots.txt
        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        location = /robots.txt {
            log_not_found off;
            access_log off;
        }

        # Deny access to sensitive files
        location ~ \.(env|sql|json|lock|composer\.json)$ {
            deny all;
        }
    }

    # Include additional config files
    include /etc/nginx/conf.d/*.conf;
}
