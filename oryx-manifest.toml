[build]
runtime = "php"
runtimeVersion = "8.3"
packageManager = "composer"

[startupScriptCommands]
# Copy our custom nginx server block (with security deny rules) into sites-enabled
# BEFORE starting nginx, so it actually takes effect.
commands = [
  "cp /home/site/wwwroot/.nginx/default.conf /etc/nginx/sites-enabled/default",
  "mkdir -p /etc/nginx/conf.d",
  "echo 'client_max_body_size 200M;' > /etc/nginx/conf.d/uploads.conf",
  "/usr/sbin/php-fpm",
  "nginx -g 'daemon off;'"
]
