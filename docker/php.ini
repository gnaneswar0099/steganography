; Upload limits matching application code requirements
upload_max_filesize = 20M
post_max_size       = 35M
max_file_uploads    = 16

; Memory & execution limits
; Render free tier has 512MB total RAM. OS + Apache take ~120-150MB.
memory_limit        = 320M
max_execution_time  = 120
max_input_time      = 120

; Security settings
expose_php          = Off
display_errors      = Off
log_errors          = On
allow_url_include   = Off
open_basedir        = /var/www/html:/tmp
disable_functions   = exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,show_source,pcntl_exec

; Sessions
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = Strict

; Opcache
opcache.enable                  = 1
opcache.memory_consumption      = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files   = 4000
opcache.revalidate_freq         = 60