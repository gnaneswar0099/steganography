<VirtualHost *:10000>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # ── Security: strip version info from response headers ──────────────
    ServerTokens Prod
    ServerSignature Off
    Header always unset X-Powered-By
    Header always set X-Permitted-Cross-Domain-Policies "none"

    # Real client IP from Render reverse proxy
    RemoteIPHeader X-Forwarded-For
    # Loopback and private ranges (Render's internal proxy)
    RemoteIPInternalProxy 127.0.0.0/8
    RemoteIPInternalProxy ::1
    RemoteIPInternalProxy 10.0.0.0/8
    RemoteIPInternalProxy 172.16.0.0/12
    RemoteIPInternalProxy 192.168.0.0/16

    # Cloudflare edge ranges (Render's public edge)
    RemoteIPTrustedProxy 103.21.244.0/22
    RemoteIPTrustedProxy 103.22.200.0/22
    RemoteIPTrustedProxy 103.31.4.0/22
    RemoteIPTrustedProxy 104.16.0.0/13
    RemoteIPTrustedProxy 104.24.0.0/14
    RemoteIPTrustedProxy 108.162.192.0/18
    RemoteIPTrustedProxy 131.0.72.0/22
    RemoteIPTrustedProxy 141.101.64.0/18
    RemoteIPTrustedProxy 162.158.0.0/15
    RemoteIPTrustedProxy 172.64.0.0/13
    RemoteIPTrustedProxy 173.245.48.0/20
    RemoteIPTrustedProxy 188.114.96.0/20
    RemoteIPTrustedProxy 190.93.240.0/20
    RemoteIPTrustedProxy 197.234.240.0/22
    RemoteIPTrustedProxy 198.41.128.0/17
    RemoteIPTrustedProxy 2400:cb00::/32
    RemoteIPTrustedProxy 2606:4700::/32
    RemoteIPTrustedProxy 2803:f800::/32
    RemoteIPTrustedProxy 2405:b500::/32
    RemoteIPTrustedProxy 2405:8100::/32
    RemoteIPTrustedProxy 2a06:98c0::/29
    RemoteIPTrustedProxy 2c0f:f248::/32

    # HTTPS flag forwarded by proxy
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Block direct access to backend PHP files
    <FilesMatch "^(app_config|db|crypto|lsb|prng|payload|nav|error_session|mailer)\.php$">
        Require all denied
    </FilesMatch>

    # Block sensitive files and configs
    <FilesMatch "^(composer\.(json|lock)|requirements\.txt|\.env|\.user\.ini|ca\.pem|schema\.sql)$">
        Require all denied
    </FilesMatch>

    # Block directories
    <DirectoryMatch "^/var/www/html/(vendor|bin|docker|migrations|\.git|\.nginx)">
        Require all denied
    </DirectoryMatch>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml
    </IfModule>

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css "access plus 7 days"
        ExpiresByType text/javascript "access plus 7 days"
        ExpiresByType application/javascript "access plus 7 days"
        ExpiresByType image/svg+xml "access plus 30 days"
        ExpiresByType image/png "access plus 30 days"
        ExpiresByType image/jpeg "access plus 30 days"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
